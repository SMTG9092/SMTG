<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoufStock - Cartes des Pages & Permissions</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darker: '#010309',
                        dark: '#070b14',
                        cardbg: '#0d1322',
                        cardhover: '#131c38',
                        bordercolor: '#1e293b',
                        neonemerald: '#10b981'
                    },
                    boxShadow: {
                        'neon-glow': '0 0 25px -5px rgba(16, 185, 129, 0.15)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #010309;
            color: #f8fafc;
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        }

        .cyber-grid {
            background-image: radial-gradient(rgba(16, 185, 129, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .glass-card {
            background: linear-gradient(135deg, rgba(13, 19, 34, 0.9) 0%, rgba(7, 11, 20, 0.95) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            border-color: rgba(16, 185, 129, 0.3);
            box-shadow: 0 10px 30px -10px rgba(16, 185, 129, 0.2);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="cyber-grid min-h-screen flex flex-col p-8">

    <!-- Header Section -->
    <div class="max-w-7xl w-full mx-auto mb-8 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 border-b border-bordercolor pb-6">
        <div>
            <div class="flex items-center gap-2 mb-1">
                <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] font-black px-2 py-0.5 rounded uppercase tracking-wider">Module Sécurité</span>
            </div>
            <h1 class="text-2xl font-black text-white flex items-center gap-3">
                <i class="fas fa-th-large text-emerald-400"></i> Cartes des Pages & Accès
            </h1>
        </div>
        <div>
            <select id="userSelectCard" class="bg-cardbg border border-bordercolor text-white text-xs rounded-xl px-4 py-3 outline-none focus:border-emerald-500 font-semibold cursor-pointer shadow-inner">
                <option value="">-- Sélectionnez un Utilisateur --</option>
            </select>
        </div>
    </div>

    <!-- Cards Grid Container -->
    <main class="max-w-7xl w-full mx-auto flex-1">
        <div id="pagesCardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Cards will be injected here -->
            <div class="col-span-full py-16 text-center text-slate-500 text-xs">
                <i class="fas fa-spinner fa-spin text-lg text-emerald-400 mb-2"></i>
                <p>Veuillez sélectionner un utilisateur pour afficher ses cartes de permissions...</p>
            </div>
        </div>
    </main>

    <!-- Script to load and render cards dynamically -->
    <script type="module">
        import supabase from '../assets/js/core/supabase.js';

        let currentUserId = null;

        document.addEventListener("DOMContentLoaded", async () => {
            await loadUsers();

            document.getElementById("userSelectCard").addEventListener("change", async (e) => {
                currentUserId = e.target.value;
                if (currentUserId) {
                    await loadUserPageCards(currentUserId);
                } else {
                    document.getElementById("pagesCardsGrid").innerHTML = `
                        <div class="col-span-full py-16 text-center text-slate-500 text-xs">
                            <i class="fas fa-user-slash text-xl text-slate-600 mb-2"></i>
                            <p>Veuillez sélectionner un utilisateur...</p>
                        </div>`;
                }
            });
        });

        async function loadUsers() {
            try {
                const { data, error } = await supabase
                    .from('user_profiles')
                    .select('id, nom_complet, username, email')
                    .order('nom_complet', { ascending: true });

                if (error) throw error;

                const select = document.getElementById("userSelectCard");
                data.forEach(user => {
                    const name = user.nom_complet || user.username || user.email;
                    const opt = document.createElement('option');
                    opt.value = user.id;
                    opt.textContent = name;
                    select.appendChild(opt);
                });
            } catch (err) {
                console.error("Erreur chargement utilisateurs:", err);
            }
        }

        async function loadUserPageCards(userId) {
            try {
                document.getElementById("pagesCardsGrid").innerHTML = `
                    <div class="col-span-full py-16 text-center text-slate-400 text-xs">
                        <i class="fas fa-spinner fa-spin text-lg text-emerald-400 mb-2"></i>
                        <p>Chargement des cartes...</p>
                    </div>`;

                const { data: pages } = await supabase.from('pages').select('*').order('ordre_affichage', { ascending: true });
                const { data: actions } = await supabase.from('actions').select('*');
                const { data: pageActions } = await supabase.from('page_actions').select('*');
                const { data: userActions } = await supabase.from('user_page_actions').select('*').eq('user_id', userId);

                const permMap = {};
                userActions.forEach(ua => { permMap[ua.page_action_id] = ua.autorise; });

                const paMap = {};
                pageActions.forEach(pa => {
                    if (!paMap[pa.page_id]) paMap[pa.page_id] = {};
                    const act = actions.find(a => a.id === pa.action_id);
                    if (act) {
                        const isAuth = permMap[pa.id] !== undefined ? permMap[pa.id] : true;
                        paMap[pa.page_id][act.code] = { id: pa.id, autorise: isAuth };
                    }
                });

                let html = '';
                pages.forEach(page => {
                    const pageActs = paMap[page.id] || {};
                    
                    html += `
                        <div class="glass-card rounded-2xl p-5 flex flex-col justify-between shadow-xl">
                            <div>
                                <!-- Card Header -->
                                <div class="flex items-center justify-between mb-3 pb-3 border-b border-bordercolor/60">
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400">
                                            <i class="fas fa-file-code text-sm"></i>
                                        </div>
                                        <div>
                                            <h3 class="text-sm font-black text-white">${page.nom}</h3>
                                            <span class="text-[10px] text-slate-400 font-mono">${page.url || '---'}</span>
                                        </div>
                                    </div>
                                </div>

                                <!-- Actions Badges / Checkboxes -->
                                <div class="space-y-2 mb-4">
                                    <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider block">الصلاحيات المتاحة:</span>
                                    <div class="flex flex-wrap gap-1.5">
                    `;

                    const actionNames = {
                        'view': { label: 'دخول (View)', icon: 'fa-eye' },
                        'ajouter': { label: 'إضافة (Add)', icon: 'fa-plus' },
                        'modifier': { label: 'تعديل (Edit)', icon: 'fa-pen' },
                        'supprimer': { label: 'حذف (Delete)', icon: 'fa-trash' },
                        'imprimer': { label: 'طباعة (Print)', icon: 'fa-print' },
                        'valider': { label: 'مصادقة (Validate)', icon: 'fa-check' },
                        'lancer': { label: 'تنفيذ (Launch)', icon: 'fa-play' }
                    };

                    Object.keys(actionNames).forEach(code => {
                        const actObj = pageActs[code];
                        if (actObj) {
                            const activeClass = actObj.autorise 
                                ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' 
                                : 'bg-red-500/10 text-red-400 border-red-500/30 opacity-50';
                            
                            html += `
                                <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border text-[10px] font-bold ${activeClass}">
                                    <i class="fas ${actionNames[code].icon}"></i>
                                    <span>${actionNames[code].label}</span>
                                </div>
                            `;
                        }
                    });

                    html += `
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });

                document.getElementById("pagesCardsGrid").innerHTML = html;

            } catch (err) {
                console.error("Erreur:", err);
                document.getElementById("pagesCardsGrid").innerHTML = `
                    <div class="col-span-full py-16 text-center text-red-400 text-xs">
                        <i class="fas fa-exclamation-triangle text-xl mb-2"></i>
                        <p>حدث خطأ أثناء تحميل الكارتات.</p>
                    </div>`;
            }
        }
    </script>
</body>
</html>
