<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoufStock Enterprise - Modern Cyber Style</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darker: '#02040a',
                        dark: '#080c19',
                        surface: '#0f172a',
                        surfacehover: '#1e293b',
                        neoncyan: '#06b6d4',
                        neonemerald: '#10b981'
                    },
                    boxShadow: {
                        'neon-glow': '0 0 25px -5px rgba(16, 185, 129, 0.25)',
                        'cyan-glow': '0 0 25px -5px rgba(6, 182, 212, 0.25)'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #02040a;
            color: #f1f5f9;
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        }

        .cyber-grid {
            background-image: radial-gradient(rgba(16, 185, 129, 0.08) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .glass-card {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.8) 0%, rgba(8, 12, 25, 0.9) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
    </style>
</head>
<body class="cyber-grid min-h-screen flex items-center justify-center p-6">

    <!-- CONTAINER -->
    <div class="max-w-md w-full glass-card rounded-3xl p-8 shadow-2xl relative overflow-hidden">
        
        <!-- Top Glow Effect -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Header -->
        <div class="flex items-center gap-4 mb-6">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-500/20 to-cyan-500/20 border border-emerald-500/30 flex items-center justify-center text-emerald-400 shadow-neon-glow">
                <i class="fas fa-layer-group text-2xl"></i>
            </div>
            <div>
                <h2 class="text-lg font-black tracking-wide text-white">SoufStock UI</h2>
                <span class="text-xs text-emerald-400 font-bold tracking-widest uppercase">Next-Gen Interface</span>
            </div>
        </div>

        <!-- Content Box -->
        <p class="text-xs text-slate-400 mb-6 leading-relaxed">
            Had l-style m-gadd خصيصاً باش يتماشى مع الواجهات الحديثة ديال الـ ERP و الـ WMS، كيعتمد على التباين العالي (High Contrast) و الـ Glassmorphism.
        </p>

        <!-- Action Button -->
        <button class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-black text-xs py-3.5 px-4 rounded-2xl transition-all duration-300 shadow-neon-glow flex items-center justify-center gap-2 cursor-pointer">
            <i class="fas fa-bolt"></i> Appliquer le Style
        </button>

    </div>

</body>
</html>
