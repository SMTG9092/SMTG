<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Magasins - SoufStock Enterprise ERP/WMS</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            950: '#020617',
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                            400: '#94a3b8',
                            300: '#cbd5e1',
                            100: '#f1f5f9'
                        },
                        emerald: {
                            500: '#10b981',
                            600: '#059669',
                            400: '#34d399',
                            300: '#6ee7b7'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
        body { background-color: #020617; color: #f1f5f9; font-family: ui-sans-serif, system-ui, sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex overflow-hidden">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col h-screen p-4 select-none shrink-0">
        <div class="flex items-center gap-3 px-2 mb-6">
            <div class="w-9 h-9 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-500">
                <i class="fas fa-snowflake text-lg"></i>
            </div>
            <div>
                <span class="font-bold text-base tracking-wide block text-slate-100">SoufStock</span>
                <span class="text-[10px] text-slate-400 tracking-wider uppercase block">Enterprise ERP</span>
            </div>
        </div>
        
        <nav id="sidebarNav" class="flex-1 overflow-y-auto pr-1">
            <!-- Dynamic Sidebar -->
        </nav>

        <div class="pt-4 mt-auto border-t border-slate-800/80">
            <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3 mb-2">
                <span id="sidebarUserName" class="block text-xs font-bold text-slate-200 truncate uppercase">YAHYA SOUFIANE</span>
                <span class="block text-[10px] text-emerald-400 font-medium mt-0.5">Administrateur</span>
            </div>
            <button id="logoutBtn" class="w-full bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 rounded-xl py-2 px-3 text-xs font-semibold transition flex items-center justify-center gap-2">
                <i class="fas fa-sign-out-alt"></i> Déconnexion
            </button>
        </div>
    </aside>

    <!-- MAIN CONTAINER -->
    <div class="flex-1 flex flex-col h-screen min-w-0 overflow-hidden relative">
        
        <!-- HEADER -->
        <header class="h-20 bg-slate-900/40 border-b border-slate-800/80 px-8 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-4">
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-slate-100">Gestion des Magasins</h1>
                    <div class="text-xs text-slate-400 flex items-center gap-1.5 mt-0.5">
                        <span>Accueil</span>
                        <span>/</span>
                        <strong class="text-slate-300">Magasins & Entrepôts</strong>
                    </div>
                </div>
            </div>
            
            <button onclick="openModal()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-4 py-2.5 rounded-xl text-xs transition cursor-pointer shadow-lg flex items-center gap-2">
                <i class="fas fa-plus"></i> Nouveau Magasin
            </button>
        </header>

        <!-- PAGE BODY -->
        <main class="flex-1 p-8 overflow-y-auto">
            <div class="max-w-6xl mx-auto flex flex-col gap-6">
                
                <!-- TABLE -->
                <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl flex flex-col">
                    <div class="overflow-x-auto flex-1">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-950/60 text-slate-400 text-[11px] uppercase tracking-wider border-b border-slate-800">
                                    <th class="py-3 px-4">Code Magasin</th>
                                    <th class="py-3 px-4">Libellé Magasin</th>
                                    <th class="py-3 px-4 text-center">Gère Emplacements</th>
                                    <th class="py-3 px-4 text-center">Nombre d'Emplacements</th>
                                    <th class="py-3 px-4 text-center">Statut</th>
                                    <th class="py-3 px-4 text-center">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="magasinsTableBody" class="divide-y divide-slate-800/60 text-xs text-slate-300">
                                <!-- Dynamic rows -->
                            </tbody>
                        </table>
                    </div>
                    
                    <!-- TOTAL FOOTER ROW -->
                    <div id="tableFooterSummary" class="bg-slate-950/80 border-t border-slate-800 px-6 py-3.5 flex items-center justify-between text-xs text-slate-300 font-semibold hidden">
                        <div class="flex items-center gap-2">
                            <span class="text-slate-400">Total Magasins :</span>
                            <span id="totalMagasinsCount" class="text-emerald-400 font-mono font-bold">0</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-slate-400">Total Général Emplacements :</span>
                            <span id="totalEmplacementsCount" class="text-emerald-400 font-mono font-bold bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/20">0</span>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- MODAL AJOUT / MODIF -->
    <div id="magasinModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-md w-full mx-4 shadow-2xl flex flex-col">
            <h3 id="modalTitle" class="text-base font-bold text-slate-100 mb-4">Ajouter un Magasin</h3>
            
            <form onsubmit="saveMagasin(event)" class="flex flex-col gap-4">
                <input type="hidden" id="magasinId">
                
                <div>
                    <label class="text-[11px] font-semibold text-slate-300 block mb-1">Code Magasin * (Ex: A408)</label>
                    <input type="text" id="codeMagasin" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 uppercase font-mono focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="text-[11px] font-semibold text-slate-300 block mb-1">Libellé / Désignation *</label>
                    <input type="text" id="libelleMagasin" required placeholder="Ex: Magasin Principal Froid" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>

                <div class="flex items-center gap-3 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5">
                    <input type="checkbox" id="gereEmplacement" class="w-4 h-4 accent-emerald-500 rounded cursor-pointer">
                    <label for="gereEmplacement" class="text-xs font-semibold text-slate-300 cursor-pointer select-none">Ce magasin gère les emplacements</label>
                </div>

                <div>
                    <label class="text-[11px] font-semibold text-slate-300 block mb-1">Statut</label>
                    <select id="statutMagasin" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 uppercase focus:outline-none focus:border-emerald-500 font-bold">
                        <option value="ACTIF" class="text-emerald-400">ACTIF</option>
                        <option value="INACTIF" class="text-red-400">INACTIF</option>
                    </select>
                </div>

                <div class="flex items-center gap-3 w-full mt-2">
                    <button type="button" onclick="closeModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-2.5 rounded-xl text-xs transition cursor-pointer">
                        Annuler
                    </button>
                    <button type="submit" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2.5 rounded-xl text-xs transition cursor-pointer shadow-lg">
                        Enregistrer
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script type="module">
        import Navigation from '../assets/js/core/navigation.js';
        import supabase from '../assets/js/core/supabase.js';

        document.addEventListener("DOMContentLoaded", async () => {
            await Navigation.init();

            const logoutBtn = document.getElementById("logoutBtn");
            if (logoutBtn) {
                logoutBtn.addEventListener("click", async () => {
                    await supabase.auth.signOut();
                    window.location.href = "login.html";
                });
            }

            await loadMagasins();
        });

        window.loadMagasins = async function() {
            const { data: magasins, error } = await supabase.from('magasins').select('*').order('code_magasin', { ascending: true });
            const tbody = document.getElementById("magasinsTableBody");
            const footerSummary = document.getElementById("tableFooterSummary");

            if (error) {
                console.error(error);
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-red-400">Erreur de chargement des magasins.</td></tr>`;
                footerSummary.classList.add("hidden");
                return;
            }

            if (!magasins || magasins.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-slate-500">Aucun magasin trouvé.</td></tr>`;
                footerSummary.classList.add("hidden");
                return;
            }

            tbody.innerHTML = '';
            let totalEmplacementsGlobal = 0;

            for (const mag of magasins) {
                let totalEmplacements = 0;
                if (mag.gere_emplacement) {
                    const { count, error: countError } = await supabase
                        .from('emplacements')
                        .select('*', { count: 'exact', head: true })
                        .eq('magasin_code', mag.code_magasin);
                    totalEmplacements = countError ? 0 : count;
                    totalEmplacementsGlobal += totalEmplacements;
                }

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-900/60 transition">
                        <td class="py-3 px-4 font-bold text-emerald-400 font-mono">${mag.code_magasin}</td>
                        <td class="py-3 px-4 font-semibold text-slate-100">${mag.libelle_magasin}</td>
                        <td class="py-3 px-4 text-center">
                            <span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${mag.gere_emplacement ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-slate-800 text-slate-400 border border-slate-700'}">
                                ${mag.gere_emplacement ? 'OUI' : 'NON'}
                            </span>
                        </td>
                        <td class="py-3 px-4 text-center">
                            ${mag.gere_emplacement ? `
                                <a href="emplacements.html?magasin=${mag.code_magasin}" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-slate-950 border border-slate-800 text-slate-200 hover:border-emerald-500 transition">
                                    <i class="fas fa-th text-emerald-400 text-[10px]"></i>
                                    ${totalEmplacements} Emplacement(s)
                                </a>
                            ` : `<span class="text-slate-500 italic text-[11px]">Non gكré</span>`}
                        </td>
                        <td class="py-3 px-4 text-center">
                            <span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${mag.statut === 'ACTIF' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-red-500/10 text-red-400 border border-red-500/20'}">${mag.statut}</span>
                        </td>
                        <td class="py-3 px-4 text-center space-x-2">
                            <button onclick="openModal(${mag.id}, '${mag.code_magasin}', '${mag.libelle_magasin.replace(/'/g, "\\'")}', ${mag.gere_emplacement}, '${mag.statut}')" class="text-blue-400 hover:text-blue-300 p-1 cursor-pointer" title="Modifier"><i class="fas fa-edit"></i></button>
                            <button onclick="deleteMagasin(${mag.id}, '${mag.code_magasin}')" class="text-red-400 hover:text-red-300 p-1 cursor-pointer" title="Supprimer"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            }

            document.getElementById("totalMagasinsCount").textContent = magasins.length;
            document.getElementById("totalEmplacementsCount").textContent = totalEmplacementsGlobal;
            footerSummary.classList.remove("hidden");
        }

        window.openModal = function(id = '', code = '', libelle = '', gere = true, statut = 'ACTIF') {
            document.getElementById("magasinId").value = id;
            document.getElementById("codeMagasin").value = code;
            document.getElementById("libelleMagasin").value = libelle;
            document.getElementById("gereEmplacement").checked = Boolean(gere);
            document.getElementById("statutMagasin").value = statut;
            document.getElementById("modalTitle").textContent = id ? "Modifier le Magasin" : "Ajouter un Magasin";
            document.getElementById("magasinModal").classList.remove("hidden");
        }

        window.closeModal = function() {
            document.getElementById("magasinModal").classList.add("hidden");
        }

        window.saveMagasin = async function(event) {
            event.preventDefault();
            const id = document.getElementById("magasinId").value;
            const code_magasin = document.getElementById("codeMagasin").value.trim().toUpperCase();
            const libelle_magasin = document.getElementById("libelleMagasin").value.trim();
            const gere_emplacement = document.getElementById("gereEmplacement").checked;
            const statut = document.getElementById("statutMagasin").value;

            closeModal();

            let query;
            if (id) {
                query = supabase.from('magasins').update({ code_magasin, libelle_magasin, gere_emplacement, statut, updated_at: new Date().toISOString() }).eq('id', id);
            } else {
                query = supabase.from('magasins').insert([{ code_magasin, libelle_magasin, gere_emplacement, statut }]);
            }

            const { error } = await query;
            if (error) {
                alert("Erreur: " + error.message);
            } else {
                loadMagasins();
            }
        }

        window.deleteMagasin = async function(id, code) {
            if (confirm(`Voulez-vous vraiment supprimer le magasin [ ${code} ] ?`)) {
                const { error } = await supabase.from('magasins').delete().eq('id', id);
                if (error) {
                    alert("Erreur de suppression: " + error.message);
                } else {
                    loadMagasins();
                }
            }
        }
    </script>
</body>
</html>
