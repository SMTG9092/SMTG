<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoufStock - Gestion des Réservations & Picking (AB10)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#1e293b',
                            950: '#020617',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col">

    <!-- En-tête -->
    <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-500/10 border border-emerald-500/20 p-2.5 rounded-xl text-emerald-400">
                    <i class="fas fa-boxes-stacked text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base tracking-wide text-slate-100">SoufStock <span class="text-emerald-400 text-xs font-mono ml-2 px-2 py-0.5 rounded bg-emerald-500/10 border border-emerald-500/20">ERP / WMS</span></h1>
                    <p class="text-xs text-slate-400">Module de validation des transferts et du picking (AB10)</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button id="processAb10Button" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition shadow-lg shadow-emerald-900/30 flex items-center space-x-2">
                    <i class="fas fa-check-double"></i>
                    <span>Traiter la Sélection (AB10)</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Contenu Principal -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">
        
        <!-- Barre de recherche et filtres -->
        <div class="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="w-full md:w-96 relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                    <i class="fas fa-search text-xs"></i>
                </span>
                <input type="text" id="searchInput" placeholder="Rechercher par doc, article, lot..." class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 transition">
            </div>
            <div class="flex items-center space-x-2 w-full md:w-auto justify-end">
                <span class="text-xs text-slate-400"><i class="fas fa-info-circle mr-1 text-sky-400"></i> Seuls les pickings valides sont sélectionnables.</span>
            </div>
        </div>

        <!-- Tableau des données -->
        <div class="bg-slate-900/40 border border-slate-800/80 rounded-2xl overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800 bg-slate-900/80 text-[11px] uppercase tracking-wider text-slate-400 font-semibold">
                            <th class="p-4 text-center w-12">
                                <input type="checkbox" id="selectAllCheckbox" class="rounded bg-slate-950 border-slate-700 text-emerald-500 focus:ring-emerald-500 w-4 h-4 cursor-pointer">
                            </th>
                            <th class="p-4">Doc. Vente</th>
                            <th class="p-4">Article</th>
                            <th class="p-4">Lot</th>
                            <th class="p-4">Magasin</th>
                            <th class="p-4 text-right">Qté Réservée</th>
                            <th class="p-4 text-center">Statut Réservation</th>
                            <th class="p-4 text-center">Statut Picking</th>
                        </tr>
                    </thead>
                    <tbody id="reservationsTableBody" class="divide-y divide-slate-800/60 text-xs">
                        <!-- Injection dynamique via script JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Script JavaScript Intégré -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            initApp();
        });

        function initApp() {
            setupEventListeners();
            loadReservationsData();
        }

        function setupEventListeners() {
            const searchInput = document.getElementById("searchInput");
            if (searchInput) {
                searchInput.addEventListener("input", (e) => {
                    filterTableData(e.target.value);
                });
            }

            const selectAllCheckbox = document.getElementById("selectAllCheckbox");
            if (selectAllCheckbox) {
                selectAllCheckbox.addEventListener("change", (e) => {
                    const checkboxes = document.querySelectorAll(".row-checkbox:not(:disabled)");
                    checkboxes.forEach(cb => cb.checked = e.target.checked);
                });
            }

            const processButton = document.getElementById("processAb10Button");
            if (processButton) {
                processButton.addEventListener("click", () => {
                    handleProcessAb10Selection();
                });
            }
        }

        // Données d'exemple initiales
        let currentReservationsData = [
            {
                id: 1,
                document_vente: "CMD-2026-089",
                article: "ART-9942",
                designation_article: "Bobine Film Étirable 500mm",
                lot: "LOT-2026-A1",
                magasin: "DEPOT-01",
                quantite_reservee: 120.000,
                unite: "KG",
                statut: "TRANSFEREE_AB10",
                picking: { statut: "TERMINE" }
            },
            {
                id: 2,
                document_vente: "CMD-2026-090",
                article: "ART-1102",
                designation_article: "Carton d'emballage Standard XL",
                lot: "LOT-2026-B3",
                magasin: "DEPOT-02",
                quantite_reservee: 450.000,
                unite: "PCE",
                statut: "RESERVEE",
                picking: { statut: "VALIDE" }
            },
            {
                id: 3,
                document_vente: "CMD-2026-091",
                article: "ART-3321",
                designation_article: "Adhésif PVC Transparent 48mm",
                lot: "LOT-2026-C9",
                magasin: "DEPOT-01",
                quantite_reservee: 75.500,
                unite: "KG",
                statut: "RESERVEE",
                picking: { statut: "EN_COURS" }
            }
        ];

        function loadReservationsData() {
            renderTable(currentReservationsData);
        }

        function renderTable(data) {
            const tbody = document.getElementById("reservationsTableBody");
            if (!tbody) return;

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-slate-400 text-xs"><i class="fas fa-folder-open mr-2"></i> Aucune réservation trouvée pour cette date.</td></tr>`;
                return;
            }

            let html = "";
            data.forEach(item => {
                let badgeResColor = 'bg-slate-500/10 text-slate-400 border-slate-500/20';
                if (item.statut === 'TRANSFEREE_AB10' || item.statut === 'VALIDEE') {
                    badgeResColor = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
                } else if (item.statut === 'RESERVEE') {
                    badgeResColor = 'bg-sky-500/10 text-sky-400 border-sky-500/20';
                }

                let pickingStatut = item.picking ? item.picking.statut : 'NON_ASSOCIE';
                let badgePickColor = 'bg-slate-500/10 text-slate-400 border-slate-500/20';
                if (pickingStatut === 'TERMINE' || pickingStatut === 'VALIDE') {
                    badgePickColor = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
                } else if (pickingStatut === 'EN_COURS' || pickingStatut === 'PICKING') {
                    badgePickColor = 'bg-amber-500/10 text-amber-400 border-amber-500/20';
                }

                let isValidPicking = (pickingStatut === 'VALIDE' || pickingStatut === 'TERMINE');
                let checkboxDisabled = !isValidPicking ? 'disabled' : '';
                let checkboxClass = !isValidPicking ? 'opacity-30 cursor-not-allowed' : 'cursor-pointer';

                html += `
                    <tr class="hover:bg-slate-800/35 transition">
                        <td class="p-4 text-center">
                            <input type="checkbox" class="row-checkbox rounded bg-slate-950 border-slate-700 text-emerald-500 focus:ring-emerald-500 w-4 h-4 ${checkboxClass}" 
                                data-id="${item.id}" ${checkboxDisabled} ${!isValidPicking ? 'title="Le Picking doit être VALIDE ou TERMINE pour pouvoir être sélectionné"' : ''}>
                        </td>
                        <td class="p-4 font-mono font-semibold text-emerald-400 text-xs">${item.document_vente || '-'}</td>
                        <td class="p-4 text-slate-100 text-xs">
                            <span class="font-mono font-bold text-slate-200">${item.article || ''}</span>
                            <span class="text-slate-400 block text-[11px]">${item.designation_article || ''}</span>
                        </td>
                        <td class="p-4 font-mono text-slate-300 text-xs">${item.lot || '-'}</td>
                        <td class="p-4 text-slate-300 text-xs font-medium">${item.magasin || '-'}</td>
                        <td class="p-4 text-right font-mono font-bold text-sky-400 text-xs">
                            ${Number(item.quantite_reservee || 0).toLocaleString(undefined, {minimumFractionDigits: 3})} <span class="text-[10px] text-slate-400">${item.unite || 'KG'}</span>
                        </td>
                        <td class="p-4 text-center">
                            <span class="px-2.5 py-1 rounded-full text-[10px] font-semibold border ${badgeResColor}">
                                ${item.statut || 'RESERVEE'}
                            </span>
                        </td>
                        <td class="p-4 text-center">
                            <span class="px-2.5 py-1 rounded-full text-[10px] font-semibold border ${badgePickColor}">
                                ${pickingStatut}
                            </span>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        function filterTableData(searchTerm) {
            const term = searchTerm.toLowerCase();
            const filtered = currentReservationsData.filter(item => 
                (item.document_vente && item.document_vente.toLowerCase().includes(term)) ||
                (item.article && item.article.toLowerCase().includes(term)) ||
                (item.designation_article && item.designation_article.toLowerCase().includes(term)) ||
                (item.lot && item.lot.toLowerCase().includes(term))
            );
            renderTable(filtered);
        }

        function handleProcessAb10Selection() {
            const selectedCheckboxes = document.querySelectorAll(".row-checkbox:checked");
            if (selectedCheckboxes.length === 0) {
                alert("Veuillez sélectionner au moins une ligne valide.");
                return;
            }

            const selectedIds = Array.from(selectedCheckboxes).map(cb => parseInt(cb.getAttribute("data-id")));
            
            // Mise à jour locale (simulant l'appel backend/Supabase)
            currentReservationsData = currentReservationsData.map(item => {
                if (selectedIds.includes(item.id)) {
                    return {
                        ...item,
                        statut: "TRANSFEREE_AB10",
                        picking: { ...item.picking, statut: "TERMINE" }
                    };
                }
                return item;
            });

            loadReservationsData();
            alert(`Traitement AB10 effectué avec succès pour ${selectedIds.length} élément(s).`);
        }
    </script>
</body>
</html>
