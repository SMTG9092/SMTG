<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoufStock WMS - Style Moderne</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: { 950: '#020617', 900: '#0f172a', 800: '#1e293b', 700: '#334155' },
                        emerald: { 600: '#059669', 500: '#10b981', 400: '#34d399' }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Scrollbar Zwin */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased h-screen flex flex-col overflow-hidden">

    <!-- HEADER DIAL L-PAGE -->
    <header class="h-16 bg-slate-900/60 border-b border-slate-800 px-6 flex items-center justify-between shrink-0 backdrop-blur-md">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-500 shadow">
                <i class="fas fa-cubes"></i>
            </div>
            <div>
                <span class="font-bold text-sm block tracking-wide">SoufStock <span class="text-emerald-400">WMS</span></span>
                <span class="text-[10px] text-slate-400 uppercase tracking-wider block">Enterprise Dashboard</span>
            </div>
        </div>
        <div class="flex items-center gap-3 font-mono text-xs">
            <span class="bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl text-emerald-400 shadow-inner">
                <i class="fas fa-circle text-[8px] mr-1.5 animate-pulse"></i> System Live
            </span>
        </div>
    </header>

    <!-- CONTENT WRAPPER -->
    <main class="flex-1 p-6 overflow-y-auto flex flex-col gap-6 max-w-7xl mx-auto w-full">
        
        <!-- EXEMPLE DE CARD / SECTION -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
            <h2 class="text-sm font-bold text-slate-100 uppercase tracking-wider mb-2 flex items-center gap-2">
                <i class="fas fa-layer-group text-emerald-400"></i> Titre dyal Section
            </h2>
            <p class="text-xs text-slate-400 mb-4">Hada texte d tawdiḥ wla description 3la l-khdma dyal had la section.</p>
            
            <!-- Boutons Examples -->
            <div class="flex items-center gap-3">
                <button class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow cursor-pointer flex items-center gap-2">
                    <i class="fas fa-check"></i> Bouton Primary
                </button>
                <button class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl text-xs font-semibold transition cursor-pointer border border-slate-700 flex items-center gap-2">
                    <i class="fas fa-xmark"></i> Bouton Secondaire
                </button>
            </div>
        </div>

    </main>
</body>
</html>
