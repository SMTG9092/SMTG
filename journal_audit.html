<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Commandes - SoufStock WMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: { 950: '#020617', 900: '#0f172a', 800: '#1e293b', 700: '#334155' },
                        emerald: { 600: '#059669', 500: '#10b981', 400: '#34d399' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased h-screen flex flex-col overflow-hidden">

    <!-- HEADER -->
    <header class="h-16 bg-slate-900/60 border-b border-slate-800 px-6 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-500">
                <i class="fas fa-boxes-stacked"></i>
            </div>
            <div>
                <span class="font-bold text-sm block">SoufStock <span class="text-emerald-400">WMS</span></span>
                <span class="text-[10px] text-slate-400 tracking-wider uppercase block">Module des Commandes</span>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <!-- LIEN VERS JOURNAL D'AUDIT -->
            <a href="journal_audit.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 cursor-pointer shadow">
                <i class="fas fa-history text-emerald-400"></i> Journal d'Audit
            </a>

            <div class="flex items-center gap-4 bg-slate-900/80 border border-slate-800 px-3 py-1.5 rounded-xl font-mono text-xs">
                <span id="liveClock" class="text-emerald-400">--:--:--</span>
            </div>
        </div>
    </header>

    <!-- MAIN WRAPPER -->
    <main class="flex-1 p-6 overflow-hidden flex flex-col gap-5">
        
        <!-- TOP CONTROLS -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex flex-wrap items-center justify-between gap-4 shadow-lg">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400">
                    <i class="fas fa-clipboard-list"></i>
                </div>
                <div>
                    <h2 class="text-xs font-bold text-slate-100 uppercase tracking-wider">Liste des Commandes</h2>
                    <p class="text-[11px] text-slate-400">Gérez vos commandes et suivez les opérations</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3 flex-wrap flex-1 justify-end">
                <div class="flex items-center gap-2 bg-slate-950 border border-slate-800 px-3 py-2 rounded-xl max-w-xs flex-1">
                    <i class="fas fa-magnifying-glass text-slate-400 text-xs"></i>
                    <input type="text" id="inputSearch" placeholder="Rechercher une commande..." class="bg-transparent text-xs text-slate-200 focus:outline-none font-mono w-full uppercase">
                </div>
                
                <button onclick="chargerCommandes()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 shadow cursor-pointer">
                    <i class="fas fa-rotate"></i> Actualiser
                </button>
            </div>
        </div>

        <!-- TABLE CONTAINER -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl flex-1 flex flex-col">
            <div class="p-4 bg-slate-900/90 border-b border-slate-800 flex items-center justify-between text-xs">
                <span class="text-slate-400 uppercase tracking-wider font-bold">Données Actives</span>
                <span id="countBadge" class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-lg font-mono text-xs">0 commandes</span>
            </div>

            <div class="overflow-x-auto flex-1">
                <table class="w-full text-left text-xs border-collapse">
                    <thead class="sticky top-0 bg-slate-950 text-slate-400 uppercase text-[10px] z-10 border-b border-slate-800">
                        <tr>
                            <th class="p-3.5">N° Commande</th>
                            <th class="p-3.5">Article</th>
                            <th class="p-3.5">Client</th>
                            <th class="p-3.5">Quantité</th>
                            <th class="p-3.5 text-center">Date Livraison</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-800/50 font-mono">
                        <tr><td colspan="5" class="p-12 text-center text-slate-500">Chargement...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- SCRIPT -->
    <script type="module">
        import supabase from '../assets/js/core/supabase.js';

        const inputSearch = document.getElementById('inputSearch');
        inputSearch.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') chargerCommandes();
        });

        window.chargerCommandes = async function() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = `<tr><td colspan="5" class="p-12 text-center text-slate-400"><i class="fas fa-spinner fa-spin mr-2"></i> Chargement...</td></tr>`;

            const searchTerm = inputSearch.value.trim().toUpperCase();
            let query = supabase.from('commandes_excel').select('*').limit(50);

            if (searchTerm) {
                query = query.or(`document_vente.ilike.%${searchTerm}%,article.ilike.%${searchTerm}%`);
            }

            const { data, error } = await query;
            if (error || !data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-12 text-center text-slate-500">Aucune commande trouvée.</td></tr>`;
                document.getElementById('countBadge').textContent = `0 commandes`;
                return;
            }

            document.getElementById('countBadge').textContent = `${data.length} commandes`;

            let html = "";
            data.forEach(c => {
                html += `
                    <tr class="hover:bg-slate-800/30 transition">
                        <td class="p-3.5 font-bold text-amber-400">${c.document_vente}</td>
                        <td class="p-3.5 text-sky-400">${c.article || '-'}</td>
                        <td class="p-3.5 text-slate-200">${c.client || '-'}</td>
                        <td class="p-3.5 text-slate-300">${c.quantite || 0} ${c.unite || ''}</td>
                        <td class="p-3.5 text-center text-emerald-400 font-bold">${c.date_livraison ? new Date(c.date_livraison).toLocaleDateString('fr-FR') : '-'}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        };

        chargerCommandes();

        setInterval(() => {
            document.getElementById("liveClock").innerText = new Date().toLocaleTimeString('fr-FR');
        }, 1000);
    </script>
</body>
</html>
