<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grille des Emplacements - SoufStock Enterprise ERP/WMS</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            950: '#020617',
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                            400: '#94a3b8',
                            300: '#cbd5e1',
                            100: '#f1f5f9'
                        },
                        emerald: {
                            500: '#10b981',
                            600: '#059669',
                            400: '#34d399',
                            300: '#6ee7b7'
                        },
                        amber: {
                            500: '#f59e0b',
                            400: '#fbbf24'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
        body { background-color: #020617; color: #f1f5f9; font-family: ui-sans-serif, system-ui, sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex overflow-hidden">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col h-screen p-4 select-none shrink-0">
        <div class="flex items-center gap-3 px-2 mb-6">
            <div class="w-9 h-9 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-500">
                <i class="fas fa-snowflake text-lg"></i>
            </div>
            <div>
                <span class="font-bold text-base tracking-wide block text-slate-100">SoufStock</span>
                <span class="text-[10px] text-slate-400 tracking-wider uppercase block">Enterprise ERP</span>
            </div>
        </div>
        
        <nav id="sidebarNav" class="flex-1 overflow-y-auto pr-1">
            <!-- Dynamic Sidebar -->
        </nav>

        <div class="pt-4 mt-auto border-t border-slate-800/80">
            <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3 mb-2">
                <span id="sidebarUserName" class="block text-xs font-bold text-slate-200 truncate uppercase">YAHYA SOUFIANE</span>
                <span class="block text-[10px] text-emerald-400 font-medium mt-0.5">Administrateur</span>
            </div>
            <button id="logoutBtn" class="w-full bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 rounded-xl py-2 px-3 text-xs font-semibold transition flex items-center justify-center gap-2">
                <i class="fas fa-sign-out-alt"></i> Déconnexion
            </button>
        </div>
    </aside>

    <!-- MAIN CONTAINER -->
    <div class="flex-1 flex flex-col h-screen min-w-0 overflow-hidden relative">
        
        <!-- HEADER -->
        <header class="h-20 bg-slate-900/40 border-b border-slate-800/80 px-8 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-4">
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-slate-100">Grille Visuelle des Emplacements</h1>
                    <div class="text-xs text-slate-400 flex items-center gap-1.5 mt-0.5">
                        <span>Accueil</span>
                        <span>/</span>
                        <strong class="text-slate-300">Cartographie WMS</strong>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <span class="flex items-center gap-1.5 text-xs text-slate-400"><span class="w-3 h-3 rounded-full bg-emerald-500/20 border border-emerald-500"></span> Libre</span>
                <span class="flex items-center gap-1.5 text-xs text-slate-400"><span class="w-3 h-3 rounded-full bg-amber-500/20 border border-amber-500"></span> Occupé</span>
            </div>
        </header>

        <!-- PAGE BODY -->
        <main class="flex-1 p-8 overflow-y-auto">
            <div class="max-w-7xl mx-auto flex flex-col gap-6">
                
                <!-- FILTER BAR -->
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col md:flex-row gap-4 items-center justify-between">
                    <div class="w-full md:w-1/3">
                        <label class="text-[11px] font-semibold text-slate-400 block mb-1">Sélectionner un Magasin :</label>
                        <select id="filterMagasin" onchange="loadGrilleEmplacements()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 uppercase focus:outline-none focus:border-emerald-500">
                            <option value="">-- Choisir un Magasin --</option>
                        </select>
                    </div>
                    <div class="w-full md:w-1/3">
                        <label class="text-[11px] font-semibold text-slate-400 block mb-1">Recherche Emplacement :</label>
                        <input type="text" id="searchEmpGrid" oninput="filterGridUI()" placeholder="Ex: A408" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 uppercase focus:outline-none focus:border-emerald-500">
                    </div>
                </div>

                <!-- GRID CONTAINER -->
                <div id="grilleContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                    <div class="col-span-full text-center py-12 text-slate-500 text-xs">
                        Veuillez sélectionner un magasin pour afficher la grille des emplacements.
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- SCRIPTS -->
    <script type="module">
        import Navigation from '../assets/js/core/navigation.js';
        import supabase from '../assets/js/core/supabase.js';

        let globalEmplacementsData = [];

        document.addEventListener("DOMContentLoaded", async () => {
            await Navigation.init();

            const logoutBtn = document.getElementById("logoutBtn");
            if (logoutBtn) {
                logoutBtn.addEventListener("click", async () => {
                    await supabase.auth.signOut();
                    window.location.href = "login.html";
                });
            }

            await loadMagasinsDropdowns();
        });

        async function loadMagasinsDropdowns() {
            const { data, error } = await supabase.from('magasins').select('code_magasin, libelle_magasin').eq('statut', 'ACTIF');
            if (error) {
                console.error("Erreur chargement magasins:", error);
                return;
            }

            const filterSelect = document.getElementById("filterMagasin");
            let html = '<option value="">-- Choisir un Magasin --</option>';
            data.forEach(mag => {
                html += `<option value="${mag.code_magasin}">${mag.code_magasin} - ${mag.libelle_magasin}</option>`;
            });
            filterSelect.innerHTML = html;
        }

        window.loadGrilleEmplacements = async function() {
            const magasinCode = document.getElementById("filterMagasin").value;
            const container = document.getElementById("grilleContainer");

            if (!magasinCode) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500 text-xs">Veuillez sélectionner un magasin pour afficher la grille des emplacements.</div>`;
                return;
            }

            container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-xs"><i class="fas fa-spinner fa-spin mr-2"></i> Chargement de la grille...</div>`;

            // 1. جلب جميع الأماكن التابعة لهذا المخزن
            const { data: emplacements, error: empError } = await supabase
                .from('emplacements')
                .select('code_emplacement, libelle_emplacement')
                .eq('magasin_code', magasinCode)
                .eq('statut', 'ACTIF')
                .order('code_emplacement', { ascending: true });

            if (empError) {
                console.error(empError);
                container.innerHTML = `<div class="col-span-full text-center py-12 text-red-400 text-xs">Erreur lors du chargement des emplacements.</div>`;
                return;
            }

            // 2. جلب المخزون الحالي المرتبط بهذا المخزن لمعرفة الأماكن العامرة وتفاصيلها
            const { data: stockList, stockError } = await supabase
                .from('stock_emplacements')
                .select('*')
                .eq('magasin', magasinCode)
                .gt('quantite', 0);

            if (stockError) {
                console.error(stockError);
            }

            // ربط كل مكان بالمخزون الموجود فيه (إن وجد)
            globalEmplacementsData = emplacements.map(emp => {
                const stockItem = stockList ? stockList.find(s => s.emplacement === emp.code_emplacement) : null;
                return {
                    code: emp.code_emplacement,
                    libelle: emp.libelle_emplacement || '',
                    isOccupied: !!stockItem,
                    stock: stockItem || null
                };
            });

            renderGrid(globalEmplacementsData);
        }

        function renderGrid(dataToRender) {
            const container = document.getElementById("grilleContainer");

            if (!dataToRender || dataToRender.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500 text-xs">Aucun emplacement trouvé pour ce magasin.</div>`;
                return;
            }

            let html = '';
            dataToRender.forEach(item => {
                if (item.isOccupied) {
                    // emplacement عامر وجلبنا معلوماته
                    html += `
                        <div class="bg-slate-900 border border-amber-500/40 rounded-2xl p-4 shadow-lg flex flex-col justify-between gap-3 relative overflow-hidden">
                            <div class="absolute top-0 right-0 bg-amber-500/10 text-amber-400 text-[10px] font-bold px-2.5 py-1 rounded-bl-xl border-l border-b border-amber-500/30">
                                OCCUPÉ
                            </div>
                            <div>
                                <div class="flex items-center gap-2 mb-1">
                                    <i class="fas fa-warehouse text-amber-400 text-sm"></i>
                                    <h4 class="font-bold text-slate-100 font-mono text-sm">${item.code}</h4>
                                </div>
                                <p class="text-[11px] text-slate-400 mb-3">${item.libelle}</p>
                                
                                <div class="bg-slate-950/70 border border-slate-800/80 rounded-xl p-2.5 flex flex-col gap-1 text-[11px]">
                                    <div class="flex justify-between">
                                        <span class="text-slate-400">Article:</span>
                                        <span class="font-bold font-mono text-blue-400">${item.stock.article}</span>
                                    </div>
                                    <div class="text-slate-300 font-medium truncate" title="${item.stock.designation_article}">
                                        ${item.stock.designation_article}
                                    </div>
                                    <div class="flex justify-between pt-1 border-t border-slate-800/60 mt-0.5">
                                        <span class="text-slate-400">Lot:</span>
                                        <span class="font-mono text-slate-200">${item.stock.lot}</span>
                                    </div>
                                    <div class="flex justify-between">
                                        <span class="text-slate-400">DLC:</span>
                                        <span class="font-mono text-slate-300">${item.stock.dlc || '-'}</span>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="flex items-center justify-between pt-2 border-t border-slate-800 text-xs">
                                <span class="text-slate-400">Quantité:</span>
                                <span class="font-bold font-mono text-emerald-400">${Number(item.stock.quantite).toLocaleString()} ${item.stock.unite}</span>
                            </div>
                        </div>
                    `;
                } else {
                    // emplacement خاوي
                    html += `
                        <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 shadow-sm flex flex-col justify-between gap-3 relative overflow-hidden opacity-80 hover:opacity-100 transition">
                            <div class="absolute top-0 right-0 bg-emerald-500/10 text-emerald-400 text-[10px] font-bold px-2.5 py-1 rounded-bl-xl border-l border-b border-emerald-500/20">
                                LIBRE
                            </div>
                            <div>
                                <div class="flex items-center gap-2 mb-1">
                                    <i class="fas fa-warehouse text-slate-500 text-sm"></i>
                                    <h4 class="font-bold text-slate-300 font-mono text-sm">${item.code}</h4>
                                </div>
                                <p class="text-[11px] text-slate-500 mb-3">${item.libelle}</p>
                                
                                <div class="py-6 text-center text-slate-600 text-xs italic">
                                    Emplacement vide
                                </div>
                            </div>
                            
                            <div class="pt-2 border-t border-slate-800/60 text-center">
                                <span class="text-[11px] text-slate-500 font-mono">0.00 KG</span>
                            </div>
                        </div>
                    `;
                }
            });

            container.innerHTML = html;
        }

        window.filterGridUI = function() {
            const query = document.getElementById("searchEmpGrid").value.trim().toUpperCase();
            if (!query) {
                renderGrid(globalEmplacementsData);
                return;
            }

            const filtered = globalEmplacementsData.filter(item => 
                item.code.toUpperCase().includes(query) || 
                (item.stock && (item.stock.article.toUpperCase().includes(query) || item.stock.designation_article.toUpperCase().includes(query) || item.stock.lot.toUpperCase().includes(query)))
            );

            renderGrid(filtered);
        }
    </script>
</body>
</html>
