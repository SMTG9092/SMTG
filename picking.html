<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picking - SoufStock WMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: { 950: '#020617', 900: '#0f172a', 800: '#1e293b', 700: '#334155' },
                        emerald: { 600: '#059669', 500: '#10b981', 400: '#34d399' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased h-screen flex flex-col overflow-hidden">

    <!-- HEADER -->
    <header class="h-16 bg-slate-900/60 border-b border-slate-800 px-6 flex items-center justify-between shrink-0">
        <a href="lancer.html" class="flex items-center gap-3 group">
            <div class="w-9 h-9 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-500 group-hover:bg-emerald-500/20 transition">
                <i class="fas fa-snowflake"></i>
            </div>
            <div>
                <span class="font-bold text-sm block">SoufStock <span class="text-emerald-400">WMS</span></span>
                <span class="text-[10px] text-slate-400 tracking-wider uppercase block">Module de Picking</span>
            </div>
        </a>
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-4 bg-slate-900/80 border border-slate-800 px-3 py-1.5 rounded-xl font-mono text-xs">
                <span id="liveClock" class="text-emerald-400">--:--:--</span>
            </div>
        </div>
    </header>

    <!-- MAIN WRAPPER -->
    <main class="flex-1 p-6 overflow-hidden flex flex-col gap-5">
        
        <!-- SEARCH BAR INPUT FOR COMMAND NUMBER -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex flex-wrap items-center justify-between gap-4 shadow-lg">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400">
                    <i class="fas fa-barcode"></i>
                </div>
                <div>
                    <h2 class="text-xs font-bold text-slate-100 uppercase tracking-wider">Sélection de Commande</h2>
                    <p class="text-[11px] text-slate-400">Entrez ou scannez le numéro de commande</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2 flex-1 max-w-md">
                <div class="flex items-center gap-2 bg-slate-950 border border-slate-800 px-3 py-2 rounded-xl flex-1">
                    <i class="fas fa-magnifying-glass text-slate-400 text-xs"></i>
                    <input type="text" id="inputNumCommande" placeholder="N° de commande (ex: CMD-...)" class="bg-transparent text-xs text-slate-200 focus:outline-none font-mono w-full uppercase">
                </div>
                <button onclick="chargerCommandePicking()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 shadow cursor-pointer shrink-0">
                    <i class="fas fa-arrow-right"></i> Valider
                </button>
            </div>
        </div>

        <!-- INFO & ARTICLES TABLE CONTAINER -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl flex-1 flex flex-col">
            <div class="p-4 bg-slate-900/90 border-b border-slate-800 flex items-center justify-between text-xs flex-wrap gap-3">
                <div class="flex items-center gap-6">
                    <div>
                        <span class="text-slate-400 block text-[10px] uppercase">Client / Réceptionnaire :</span>
                        <span id="infoClient" class="font-bold text-slate-200 text-sm">-</span>
                    </div>
                    <div>
                        <span class="text-slate-400 block text-[10px] uppercase">Itinéraire :</span>
                        <span id="infoItineraire" class="font-bold text-sky-400 text-sm">-</span>
                    </div>
                    <div>
                        <span class="text-slate-400 block text-[10px] uppercase">Statut :</span>
                        <span id="infoStatut" class="font-bold text-amber-400 text-sm">-</span>
                    </div>
                </div>
                <span id="tableCountBadge" class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-lg font-mono text-xs">0 postes</span>
            </div>

            <div class="overflow-x-auto flex-1">
                <table class="w-full text-left text-xs border-collapse">
                    <thead class="sticky top-0 bg-slate-950 text-slate-400 uppercase text-[10px] z-10 border-b border-slate-800">
                        <tr>
                            <th class="p-3.5">Poste</th>
                            <th class="p-3.5">Article</th>
                            <th class="p-3.5">Désignation</th>
                            <th class="p-3.5 text-right">Quantité Commandée</th>
                            <th class="p-3.5 text-right text-emerald-400">Quantité Préparée</th>
                            <th class="p-3.5 text-center">Unité</th>
                        </tr>
                    </thead>
                    <tbody id="pickingTableBody" class="divide-y divide-slate-800/50 font-mono">
                        <tr><td colspan="6" class="p-12 text-center text-slate-500">Veuillez scanner ou saisir un numéro de commande.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- APP SCRIPT -->
    <script type="module">
        import supabase from '../assets/js/core/supabase.js';

        const inputCmd = document.getElementById('inputNumCommande');

        inputCmd.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                chargerCommandePicking();
            }
        });

        window.chargerCommandePicking = async function() {
            const numCmd = inputCmd.value.trim();
            if (!numCmd) {
                alert("Veuillez entrer un numéro de commande.");
                return;
            }

            const tbody = document.getElementById("pickingTableBody");
            tbody.innerHTML = `<tr><td colspan="6" class="p-12 text-center text-slate-400"><i class="fas fa-spinner fa-spin mr-2"></i> Chargement des articles...</td></tr>`;

            const { data, error } = await supabase
                .from('commandes_excel')
                .select('*')
                .eq('document_vente', numCmd)
                .order('"Poste"', { ascending: true });

            if (error) {
                alert("Erreur lors du chargement : " + error.message);
                tbody.innerHTML = `<tr><td colspan="6" class="p-12 text-center text-rose-400">Erreur de chargement.</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-12 text-center text-slate-500">Aucune commande trouvée avec le numéro [${numCmd}].</td></tr>`;
                document.getElementById('infoClient').textContent = '-';
                document.getElementById('infoItineraire').textContent = '-';
                document.getElementById('infoStatut').textContent = '-';
                document.getElementById('tableCountBadge').textContent = '0 postes';
                return;
            }

            // Remplir les informations générales de la commande
            const premiereLigne = data[0];
            document.getElementById('infoClient').textContent = premiereLigne.nom_receptionnaire || 'Client Divers';
            document.getElementById('infoItineraire').textContent = premiereLigne.itineraire || 'Non assigné';
            document.getElementById('infoStatut').textContent = premiereLigne.statut || '-';
            document.getElementById('tableCountBadge').textContent = `${data.length} postes`;

            let html = "";
            data.forEach(row => {
                const qteCmd = Number(row.quantite_commandee || 0);
                const qtePrep = row.quantite_preparee !== null ? Number(row.quantite_preparee) : qteCmd;
                
                html += `
                    <tr class="hover:bg-slate-800/30 transition">
                        <td class="p-3.5 text-amber-400 font-bold">${row.Poste}</td>
                        <td class="p-3.5 text-sky-400">${row.article}</td>
                        <td class="p-3.5 text-slate-200">${row.designation_article}</td>
                        <td class="p-3.5 text-right font-bold text-slate-100">${qteCmd.toFixed(3)}</td>
                        <td class="p-3.5 text-right font-bold text-emerald-400">${qtePrep.toFixed(3)}</td>
                        <td class="p-3.5 text-center text-slate-400">${row.unite || 'KG'}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        };

        setInterval(() => {
            document.getElementById("liveClock").innerText = new Date().toLocaleTimeString('fr-FR');
        }, 1000);
    </script>
</body>
</html>
