<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Préparation Picking - SoufStock</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>SoufStock</h2>
            </div>
            <nav id="sidebarNav" class="sidebar-nav">
                <!-- Dynamic Navigation -->
            </nav>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Déconnexion</button>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <header class="top-header">
                <h1>Préparation Picking</h1>
                <div class="user-info">
                    <span id="currentDate">--</span>
                </div>
            </header>

            <div class="content-body">
                <!-- SEARCH & ACTIONS BAR -->
                <div class="card search-card">
                    <div class="search-group">
                        <label for="documentInput">N° Document de Vente :</label>
                        <input type="text" id="documentInput" placeholder="Ex: 4000795424" class="form-control">
                        <button id="searchDocBtn" class="btn btn-primary"><i class="fas fa-search"></i> Charger</button>
                        <button id="enableModifyBtn" onclick="enableModification()" disabled class="btn btn-secondary opacity-50 cursor-not-allowed"><i class="fas fa-edit"></i> Modifier</button>
                    </div>
                    <div class="action-group">
                        <button onclick="savePicking('EN_COURS')" class="btn btn-success"><i class="fas fa-save"></i> Enregistrer</button>
                        <button onclick="validatePicking('PICKING')" class="btn btn-warning"><i class="fas fa-check-circle"></i> Valider</button>
                    </div>
                </div>

                <!-- INFO CARDS -->
                <div class="info-grid">
                    <div class="info-card">
                        <span>Client</span>
                        <h3 id="infoClient">-</h3>
                    </div>
                    <div class="info-card">
                        <span>Date Création</span>
                        <h3 id="infoCreation">-</h3>
                    </div>
                    <div class="info-card">
                        <span>Date Livraison</span>
                        <h3 id="infoLivraison">-</h3>
                    </div>
                    <div class="info-card">
                        <span>Tournée / Itinéraire</span>
                        <h3 id="infoTournee">-</h3>
                        <span id="infoStatut" class="badge">EN ATTENTE</span>
                    </div>
                </div>

                <!-- TABLE -->
                <div class="card table-card">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Article & Désignation</th>
                                <th>Qté Commandée</th>
                                <th>Qté Préparée</th>
                                <th>Lot (Saisie)</th>
                                <th>Qté Lot</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="pickingTableBody">
                            <tr>
                                <td colspan="6" class="text-center">Veuillez charger un document de vente pour afficher les articles à préparer.[cite: 2]</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- SCRIPTS -->
    <script type="module">
        import Navigation from '../assets/js/core/navigation.js';
        import supabase from '../assets/js/core/supabase.js';

        let currentOrderLines = [];
        let currentDocNumber = "";
        let currentSuiviId = null;
        let currentUserProfileId = null;
        let isEditableMode = false;

        document.addEventListener("DOMContentLoaded", async () => {
            if (typeof Navigation !== 'undefined' && Navigation.init) {
                await Navigation.init();
            }

            const updateClock = () => {
                const now = new Date();
                const dateEl = document.getElementById("currentDate");
                if (dateEl) dateEl.textContent = now.toLocaleDateString('fr-FR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            };
            updateClock();

            try {
                const { data: { user } } = await supabase.auth.getUser();
                if (user) {
                    const { data: profile } = await supabase.from('user_profiles').select('id').eq('auth_user_id', user.id).single();
                    if (profile) currentUserProfileId = profile.id;
                }
            } catch (e) {
                console.error("Erreur session:", e);
            }

            const searchBtn = document.getElementById("searchDocBtn");
            const docInput = document.getElementById("documentInput");

            if (searchBtn) searchBtn.addEventListener("click", loadOrderForPicking);
            if (docInput) {
                docInput.addEventListener("keydown", (e) => {
                    if (e.key === "Enter") {
                        e.preventDefault();
                        loadOrderForPicking();
                    }
                });
            }

            const logoutBtn = document.getElementById("logoutBtn");
            if (logoutBtn) {
                logoutBtn.addEventListener("click", async () => {
                    await supabase.auth.signOut();
                    window.location.href = "login.html";
                });
            }
        });

        async function loadOrderForPicking() {
            const docInput = document.getElementById("documentInput");
            if (!docInput) return;
            const docNum = docInput.value.trim();
            const tbody = document.getElementById("pickingTableBody");
            const modifyBtn = document.getElementById("enableModifyBtn");

            isEditableMode = false;
            if (modifyBtn) {
                modifyBtn.disabled = true;
                modifyBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }

            if (!docNum) {
                alert("Veuillez saisir un numéro de document de vente.");
                return;
            }

            tbody.innerHTML = `<tr><td colspan="6" class="text-center">Recherche de la commande...</td></tr>`;

            try {
                const { data: suiviData, error: suiviErr } = await supabase
                    .from('suivi_commandes_lancer')
                    .select('*')
                    .ilike('document_vente', `%${docNum}%`)
                    .limit(1)
                    .single();

                if (suiviErr || !suiviData) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center text-error">Aucun suivi trouvé pour le document "${docNum}".</td></tr>`;
                    clearHeaderInfo();
                    return;
                }

                currentSuiviId = suiviData.id;
                const currentStatut = (suiviData.statut || "").toUpperCase();

                if (currentStatut === "IMPORTEE") {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center text-warning">Commande ${docNum} non lancée</td></tr>`;
                    clearHeaderInfo();
                    return;
                }

                const { data, error } = await supabase
                    .from('commandes_excel')
                    .select('*')
                    .ilike('document_vente', `%${docNum}%`)
                    .order('ligne_commande', { ascending: true });

                if (error || !data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center text-error">Aucune ligne d'article trouvée pour le document "${docNum}".</td></tr>`;
                    clearHeaderInfo();
                    return;
                }

                currentDocNumber = docNum;
                currentOrderLines = data;
                updateHeaderInfo(suiviData);

                const { data: existingPicking } = await supabase
                    .from('picking')
                    .select('*')
                    .eq('document_vente', docNum)
                    .single();

                let existingDetails = [];
                if (existingPicking) {
                    const statutEl = document.getElementById("infoStatut");
                    if (statutEl) statutEl.textContent = existingPicking.statut;
                    if (existingPicking.statut !== 'EN_COURS' && modifyBtn) {
                        modifyBtn.disabled = false;
                        modifyBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    }
                    
                    const { data: detailsData } = await supabase
                        .from('picking_details')
                        .select('*')
                        .eq('picking_id', existingPicking.id);
                    
                    if (detailsData) existingDetails = detailsData;
                } else {
                    const statutEl = document.getElementById("infoStatut");
                    if (statutEl) statutEl.textContent = suiviData.statut || "LANCEE";
                }

                const canEdit = (currentStatut === "LANCEE" && !existingPicking) || (existingPicking && existingPicking.statut === 'EN_COURS') || (currentStatut === "EN_PICKING");
                renderPickingTable(data, existingDetails, canEdit);

            } catch (err) {
                console.error("Erreur technique:", err);
                tbody.innerHTML = `<tr><td colspan="6" class="text-center text-error">Erreur de connexion lors du chargement.</td></tr>`;
            }
        }

        window.enableModification = function() {
            if (!currentDocNumber) return;
            isEditableMode = true;
            
            document.querySelectorAll('.lot-input, .qty-input').forEach(input => {
                input.removeAttribute('disabled');
                input.classList.remove('opacity-60', 'cursor-not-allowed');
            });
            document.querySelectorAll('#pickingTableBody button').forEach(btn => {
                btn.removeAttribute('disabled');
                btn.classList.remove('opacity-60', 'cursor-not-allowed');
            });

            alert(`Mode modification activé pour la commande ${currentDocNumber}.`);
        }

        function updateHeaderInfo(suiviData) {
            document.getElementById("infoClient").textContent = suiviData.client || '-';
            document.getElementById("infoCreation").textContent = suiviData.date_creation || '-';
            document.getElementById("infoLivraison").textContent = suiviData.date_livraison || '-';
            document.getElementById("infoTournee").textContent = suiviData.itineraire || '-';
        }

        function clearHeaderInfo() {
            currentDocNumber = "";
            currentSuiviId = null;
            currentOrderLines = [];
            isEditableMode = false;
            document.getElementById("infoClient").textContent = '-';
            document.getElementById("infoCreation").textContent = '-';
            document.getElementById("infoLivraison").textContent = '-';
            document.getElementById("infoTournee").textContent = '-';
            document.getElementById("infoStatut").textContent = "EN ATTENTE";
            
            const modifyBtn = document.getElementById("enableModifyBtn");
            if (modifyBtn) {
                modifyBtn.disabled = true;
                modifyBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }

        function renderPickingTable(lines, savedDetails, isInitialEditable) {
            const tbody = document.getElementById("pickingTableBody");
            let html = "";
            
            const isDisabledAttr = (!isInitialEditable && !isEditableMode) ? 'disabled' : '';
            const disabledClass = (!isInitialEditable && !isEditableMode) ? 'opacity-60 cursor-not-allowed' : '';

            lines.forEach((item, index) => {
                const qteCmd = Number(item.quantite_commandee || 0);
                const itemDetails = savedDetails.filter(d => d.article === item.article && d.ligne_commande === item.ligne_commande);
                
                if (itemDetails.length > 0) {
                    itemDetails.forEach((detail, subIdx) => {
                        const isFirst = subIdx === 0;
                        const rowClass = isFirst ? `main-row` : `sub-row-${index}`;
                        
                        html += `
                            <tr class="${rowClass}" data-index="${index}" data-stock-id="${detail.stock_id || ''}" data-magasin="${detail.magasin || ''}" data-detail-id="${detail.id || ''}">
                                <td>
                                    <strong>${item.article || '-'}</strong><br>
                                    <small>${item.designation_article || '-'}</small>
                                </td>
                                <td class="text-center">${isFirst ? qteCmd.toLocaleString() : '-'}</td>
                                <td class="text-center total-prep" id="total_prep_${index}">0.00</td>
                                <td class="text-center relative">
                                    <input type="text" placeholder="Lot..." value="${detail.lot || ''}" oninput="searchLots(this, '${item.article}', ${index})" ${isDisabledAttr} class="form-control lot-input ${disabledClass}">
                                    <div class="lot-suggestions hidden"></div>
                                </td>
                                <td class="text-center relative">
                                    <input type="number" step="0.001" placeholder="0.00" value="${detail.quantite_preparee || ''}" oninput="calculatePrepared(${index})" data-max-stock="999999" ${isDisabledAttr} class="form-control qty-input ${disabledClass}">
                                    <span class="error-msg hidden"></span>
                                </td>
                                <td class="text-center">
                                    ${isFirst ? `
                                    <button type="button" onclick="addLotRow(${index})" ${isDisabledAttr} class="btn btn-sm btn-success ${disabledClass}"><i class="fas fa-plus"></i></button>` : `
                                    <button type="button" onclick="removeLotRow(this, ${index})" ${isDisabledAttr} class="btn btn-sm btn-danger ${disabledClass}"><i class="fas fa-trash"></i></button>`}
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    html += `
                        <tr class="main-row" data-index="${index}">
                            <td>
                                <strong>${item.article || '-'}</strong><br>
                                <small>${item.designation_article || '-'}</small>
                            </td>
                            <td class="text-center">${qteCmd.toLocaleString()}</td>
                            <td class="text-center total-prep" id="total_prep_${index}">0.00</td>
                            <td class="text-center relative">
                                <input type="text" placeholder="Lot..." oninput="searchLots(this, '${item.article}', ${index})" ${isDisabledAttr} class="form-control lot-input ${disabledClass}">
                                <div class="lot-suggestions hidden"></div>
                            </td>
                            <td class="text-center relative">
                                <input type="number" step="0.001" placeholder="0.00" oninput="calculatePrepared(${index})" data-max-stock="0" ${isDisabledAttr} class="form-control qty-input ${disabledClass}">
                                <span class="error-msg hidden"></span>
                            </td>
                            <td class="text-center">
                                <button type="button" onclick="addLotRow(${index})" ${isDisabledAttr} class="btn btn-sm btn-success ${disabledClass}"><i class="fas fa-plus"></i></button>
                            </td>
                        </tr>
                    `;
                }
            });

            tbody.innerHTML = html;
            lines.forEach((_, index) => calculatePrepared(index));
        }

        window.calculatePrepared = function(index) {
            const mainRow = document.querySelector(`tr.main-row[data-index="${index}"]`);
            if (!mainRow) return;

            let sum = 0;
            const collectAndCheck = (r) => {
                const qtyInput = r.querySelector(".qty-input");
                if (!qtyInput) return 0;
                return parseFloat(qtyInput.value) || 0;
            };

            sum += collectAndCheck(mainRow);
            let nextElement = mainRow.nextElementSibling;
            while (nextElement && nextElement.classList.contains(`sub-row-${index}`)) {
                sum += collectAndCheck(nextElement);
                nextElement = nextElement.nextElementSibling;
            }

            const totalElem = document.getElementById(`total_prep_${index}`);
            if (totalElem) totalElem.textContent = sum.toFixed(2);
        }

        window.addLotRow = function(index) {
            const mainRow = document.querySelector(`tr.main-row[data-index="${index}"]`);
            if (!mainRow) return;
            
            const articleCode = currentOrderLines[index]?.article || '';
            const newTr = document.createElement('tr');
            newTr.className = `sub-row-${index}`;
            newTr.innerHTML = `
                <td><small><i class="fas fa-level-up-alt fa-rotate-90"></i> Lot supp.</small></td>
                <td class="text-center">-</td>
                <td class="text-center">-</td>
                <td class="text-center relative">
                    <input type="text" placeholder="Lot..." oninput="searchLots(this, '${articleCode}', ${index})" class="form-control lot-input">
                    <div class="lot-suggestions hidden"></div>
                </td>
                <td class="text-center relative">
                    <input type="number" step="0.001" placeholder="0.00" oninput="calculatePrepared(${index})" data-max-stock="0" class="form-control qty-input">
                    <span class="error-msg hidden"></span>
                </td>
                <td class="text-center">
                    <button type="button" onclick="removeLotRow(this, ${index})" class="btn btn-sm btn-danger"><i class="fas fa-trash"></i></button>
                </td>
            `;

            let lastGroupRow = mainRow;
            let next = mainRow.nextElementSibling;
            while (next && next.classList.contains(`sub-row-${index}`)) {
                lastGroupRow = next;
                next = next.nextElementSibling;
            }
            lastGroupRow.after(newTr);
        }

        window.removeLotRow = function(buttonElem, index) {
            const tr = buttonElem.closest('tr');
            if (tr) {
                tr.remove();
                calculatePrepared(index);
            }
        }

        window.searchLots = async function(inputElem, articleCode, index) {
            const queryVal = inputElem.value.trim();
            const suggestionsBox = inputElem.nextElementSibling;
            if (!suggestionsBox) return;

            if (queryVal.length < 1) {
                suggestionsBox.classList.add('hidden');
                return;
            }

            try {
                const { data, error } = await supabase
                    .from('stock')
                    .select('id, lot, magasin, emplacement, stock_disponible, unite')
                    .eq('article', articleCode)
                    .ilike('lot', `%${queryVal}%`);

                if (error || !data || data.length === 0) {
                    suggestionsBox.innerHTML = `<div class="suggestion-item">Aucun lot trouvé</div>`;
                    suggestionsBox.classList.remove('hidden');
                    return;
                }

                let html = "";
                data.forEach(item => {
                    const dispo = item.stock_disponible !== undefined ? item.stock_disponible : 0;
                    html += `<div onclick='selectLot(this, ${JSON.stringify(item)}, ${index})' class="suggestion-item">
                        <span><strong>${item.lot}</strong> (Mag: ${item.magasin})</span>
                        <span>Dispo: ${parseFloat(dispo).toFixed(2)}</span>
                    </div>`;
                });

                suggestionsBox.innerHTML = html;
                suggestionsBox.classList.remove('hidden');
            } catch (err) {
                console.error("Erreur lots:", err);
            }
        }

        window.selectLot = function(element, stockItem, index) {
            const suggestionDiv = element.parentElement;
            const input = suggestionDiv.previousElementSibling;
            input.value = stockItem.lot;
            
            const row = input.closest('tr');
            row.dataset.stockId = stockItem.id;
            row.dataset.magasin = stockItem.magasin || 'PRINCIPAL';

            const dispo = stockItem.stock_disponible !== undefined ? stockItem.stock_disponible : 0;
            const qtyInput = row.querySelector('.qty-input');
            if (qtyInput) qtyInput.dataset.maxStock = dispo;

            suggestionDiv.classList.add('hidden');
            calculatePrepared(index);
        }

        async function saveOrValidatePicking(targetStatut) {
            if (!currentDocNumber || currentOrderLines.length === 0) {
                alert("Aucun document chargé.");
                return;
            }

            try {
                let activeSuiviId = currentSuiviId;
                if (!activeSuiviId) {
                    const { data: checkRow } = await supabase
                        .from('suivi_commandes_lancer')
                        .select('id')
                        .ilike('document_vente', currentDocNumber)
                        .limit(1)
                        .single();
                    if (checkRow) activeSuiviId = checkRow.id;
                }

                if (!activeSuiviId) {
                    alert("Erreur: Identifiant de suivi introuvable.");
                    return;
                }

                let totalArticlesCount = currentOrderLines.length;
                let totalLotsCount = 0;
                let totalQuantiteCmd = 0;
                let totalPrepareVal = 0;

                currentOrderLines.forEach(item => {
                    totalQuantiteCmd += Number(item.quantite_commandee || 0);
                });

                const pickingHeader = {
                    suivi_id: activeSuiviId,
                    document_vente: currentDocNumber,
                    client: currentOrderLines[0].client || 'CLIENT',
                    preparateur: currentUserProfileId,
                    statut: targetStatut === 'PICKING' ? 'VALIDE' : 'EN_COURS',
                    total_articles: totalArticlesCount,
                    total_lots: totalLotsCount,
                    total_quantite: totalQuantiteCmd,
                    total_prepare: totalPrepareVal,
                    est_valide: targetStatut === 'PICKING',
                    updated_at: new Date().toISOString()
                };

                const { data: existingPicking } = await supabase
                    .from('picking')
                    .select('id')
                    .eq('document_vente', currentDocNumber)
                    .single();

                let pickingId;
                if (existingPicking) {
                    pickingId = existingPicking.id;
                    await supabase.from('reservations_stock').delete().eq('picking_id', pickingId);
                    await supabase.from('picking_details').delete().eq('picking_id', pickingId);
                    await supabase.from('picking').update(pickingHeader).eq('id', pickingId);
                } else {
                    const { data: newPick, error: pickErr } = await supabase
                        .from('picking')
                        .insert([pickingHeader])
                        .select('id')
                        .single();
                    if (pickErr) throw pickErr;
                    pickingId = newPick.id;
                }

                const detailsPayload = [];
                currentOrderLines.forEach((item, index) => {
                    const mainRow = document.querySelector(`tr.main-row[data-index="${index}"]`);
                    if (!mainRow) return;

                    const collectRowData = (r) => {
                        const lotInput = r.querySelector('.lot-input');
                        const qtyInput = r.querySelector('.qty-input');
                        const lotVal = lotInput ? lotInput.value.trim() : '';
                        const qtePrep = parseFloat(qtyInput ? qtyInput.value : 0) || 0;
                        const stockId = r.dataset.stockId ? parseInt(r.dataset.stockId) : null;

                        if (lotVal || qtePrep > 0) {
                            totalLotsCount++;
                            totalPrepareVal += qtePrep;
                            detailsPayload.push({
                                picking_id: pickingId,
                                suivi_id: activeSuiviId,
                                document_vente: currentDocNumber,
                                stock_id: stockId,
                                ligne_commande: item.ligne_commande || (index + 1),
                                article: item.article,
                                designation_article: item.designation_article || '',
                                lot: lotVal || 'STANDARD',
                                magasin: r.dataset.magasin || 'PRINCIPAL',
                                quantite_commandee: Number(item.quantite_commandee || 0),
                                quantite_preparee: qtePrep,
                                unite: 'KG',
                                preparateur: currentUserProfileId,
                                statut: targetStatut === 'PICKING' ? 'VALIDE' : 'EN_COURS'
                            });
                        }
                    };

                    collectRowData(mainRow);
                    let next = mainRow.nextElementSibling;
                    while (next && next.classList.contains(`sub-row-${index}`)) {
                        collectRowData(next);
                        next = next.nextElementSibling;
                    }
                });

                if (detailsPayload.length > 0) {
                    await supabase.from('picking_details').insert(detailsPayload);
                }

                await supabase
                    .from('suivi_commandes_lancer')
                    .update({ 
                        statut: targetStatut === 'PICKING' ? 'PICKING_TERMINE' : 'EN_PICKING',
                        picking_par: currentUserProfileId
                    })
                    .eq('id', activeSuiviId);

                alert(targetStatut === 'PICKING' ? "Préparation validée avec succès !" : "Préparation enregistrée avec succès !");
                window.location.reload();

            } catch (err) {
                console.error("Erreur enregistrement:", err);
                alert("Erreur lors de l'enregistrement: " + err.message);
            }
        }

        window.savePicking = () => saveOrValidatePicking('EN_COURS');
        window.validatePicking = () => saveOrValidatePicking('PICKING');
    </script>
</body>
</html>
